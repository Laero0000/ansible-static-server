[defaults]
inventory = inventory/hosts.ini
roles_path = roles
host_key_checking = False
retry_files_enabled = False
interpreter_python = auto_silent
# Читаемый YAML-вывод без удалённого community.general.yaml callback
# (тот выпилен в ansible-core 2.13+; result_format работает на дефолтном callback).
callback_result_format = yaml
# Тестовое окружение пересоздаётся часто -> known_hosts только мешает.
[ssh_connection]
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
pipelining = True
