[static_servers]
static01 ansible_host=127.0.0.1 ansible_port=2222

[static_servers:vars]
# Подключаемся НЕ под root: root-логин выключается ролью ssh, а deploy создан в Dockerfile.
ansible_user=deploy
ansible_ssh_private_key_file=docker/keys/id_ed25519
ansible_become=true
ansible_become_method=sudo
ansible_python_interpreter=/usr/bin/python3
