---
nginx_server_name: _              # ловим любой Host (default_server)
nginx_web_root: /var/www          # корень; картинки лежат в {{ nginx_web_root }}/images
nginx_images_location: /images    # URL-путь раздачи
nginx_cache_expires: 1h           # срок кэширования статики (требование задания)

nginx_access_log: /var/log/nginx/static_access.log
nginx_error_log: /var/log/nginx/static_error.log

# gzip только для сжимаемых типов. Растровые jpg/png УЖЕ сжаты - их gzip не трогает.
nginx_gzip_types:
  - text/plain
  - text/css
  - text/xml
  - application/json
  - application/javascript
  - image/svg+xml
