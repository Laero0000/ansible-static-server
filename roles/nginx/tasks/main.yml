---
- name: Install nginx
  ansible.builtin.apt:
    name: nginx
    state: present

- name: Ensure web root exists
  ansible.builtin.file:
    path: "{{ nginx_web_root }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

# gzip настраивается внутри server{} (см. vhost-шаблон), а не в conf.d:
# в дефолтном nginx.conf на Ubuntu уже есть `gzip on;` в http{}, и второй
# `gzip on;` в conf.d вызывает "duplicate directive" -> nginx -t падает.
- name: Remove obsolete http-level gzip drop-in
  ansible.builtin.file:
    path: /etc/nginx/conf.d/gzip.conf
    state: absent
  notify: Reload nginx

- name: Deploy static site vhost
  ansible.builtin.template:
    src: static.conf.j2
    dest: /etc/nginx/sites-available/static.conf
    owner: root
    group: root
    mode: "0644"
  notify: Reload nginx

- name: Enable static site vhost
  ansible.builtin.file:
    src: /etc/nginx/sites-available/static.conf
    dest: /etc/nginx/sites-enabled/static.conf
    state: link
  notify: Reload nginx

- name: Disable default vhost
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Reload nginx

# Падаем громко при битом конфиге ДО reload.
- name: Validate nginx configuration
  ansible.builtin.command: nginx -t
  changed_when: false

- name: Ensure nginx is started and enabled
  ansible.builtin.service:
    name: nginx
    state: started
    enabled: true
