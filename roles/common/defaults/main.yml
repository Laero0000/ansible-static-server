---
# Обновлять список пакетов перед установкой.
common_update_cache: true
# Кэш apt считается свежим в течение этого времени (сек) -> не дёргаем apt каждый прогон.
common_cache_valid_time: 3600
# Полный upgrade системы. По умолчанию off: upgrade не идемпотентен и тормозит прогон.
# Включается через vars при необходимости.
common_full_upgrade: false

# Легко расширяемый список доп. утилит. Добавь пакет в список -> он поставится.
common_packages:
  - htop
  - ncdu
  - git
  - nano
