# Тестовое окружение. Запуск: docker compose up -d --build
# Порты: 2222 -> 22 (ssh), 80 -> 80 (nginx, по заданию).
# Хостовый ssh обычно занят 22, поэтому 2222. Если 80 занят на хосте: HTTP_PORT=8080 docker compose up -d
services:
  static-server:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: static-server
    hostname: static01
    # systemd как PID1 требует доступа к cgroup и приватного /run.
    privileged: true
    cgroup: host
    tmpfs:
      - /run
      - /run/lock
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    ports:
      - "${SSH_PORT:-2222}:22"
      - "${HTTP_PORT:-80}:80"
    stop_signal: SIGRTMIN+3
    restart: unless-stopped
